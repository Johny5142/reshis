services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      DB_PATH: /data/app.sqlite3
      COOKIE_SECURE: "true"
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set the public HTTPS origin}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?Set the exact trusted proxy peer IP as seen by the API container}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-900}
      AUTH_RATE_MAX_KEYS: ${AUTH_RATE_MAX_KEYS:-10000}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-60}
      AUTH_LOGIN_EMAIL_LIMIT: ${AUTH_LOGIN_EMAIL_LIMIT:-20}
      AUTH_REGISTER_IP_LIMIT: ${AUTH_REGISTER_IP_LIMIT:-20}
      AUTH_REGISTER_EMAIL_LIMIT: ${AUTH_REGISTER_EMAIL_LIMIT:-5}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
